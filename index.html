<!DOCTYPE html>
<html lang="pt-br   ">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.google.com/share?selection.family=Roboto:ital,wght@0,100..900;1,100..900" rel="stylesheet">
    <link rel="stylesheet" href="./style1.css">
    <title>Document</title>
</head>

<body>
    <img class="logo" src="./logo.gif" alt="logo gif">

    <main>
        <label>
            <b>converter de</b>
            <select>
                <option value="BRL">R$ real brasileiro</option>
                <option value="USD">U$ dólar americano</option>
                <option value="EUR">€ euro</option>
            </select>
        </label>
        <br>
        <label>
            <b>converter para</b>
            <select>
                <option value="USD">U$ dólar americano</option>
                <option value="EUR">€ euro</option>
                <option value="BRL">R$ real brasileiro</option>
            </select>
        </label>
            <br>
            <label>
                Valor
                <input class="currency-input" type="number" placeholder="R$ 10.000,00">  
            </label>
            <button class="converter-button">Converter</button>
            
            <section>
               <div class="currency-box">
                <img src="./brasil 2.png" alt="logo moeda a converter">
            <p class="currency">> Real brasileiro</p>
        <p class="currency-value-to-convert">R$ 0,00</p>      
          </div>

          <img class ="arrow-img" src="./Vector.png" alt="seta">
        

            <div class="currency-box">
                <img src="./estados-unidos (1) 1.png" alt="moeda-convertida">
            <p class="currency">Dolar americano</p>
        <p class="currency-value">U$ 0,00</p>      
          </div>
            </section>
      
     </main>


</body>

<script src="./script.js"></script>
</html>
